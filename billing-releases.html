<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Маркет — Release Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/tabler-icons.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f5f4f1;
  --surface: #ffffff;
  --surface-2: #f0efe9;
  --border: rgba(0,0,0,0.10);
  --border-strong: rgba(0,0,0,0.18);
  --text: #1a1a18;
  --text-muted: #6b6b65;
  --text-hint: #9e9e98;
  --accent: #1a1a18;
  --link: #185FA5;
  --radius: 12px;
  --radius-sm: 8px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1a; --surface: #252523; --surface-2: #2e2e2b;
    --border: rgba(255,255,255,0.09); --border-strong: rgba(255,255,255,0.16);
    --text: #e8e7e0; --text-muted: #9e9e98; --text-hint: #6b6b65;
    --accent: #e8e7e0; --link: #85B7EB;
  }
}
body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.6; min-height: 100vh; }

/* HEADER */
header { background: var(--surface); border-bottom: 0.5px solid var(--border-strong); padding: 1.25rem 2rem; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
.header-icon { width: 34px; height: 34px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--surface); font-size: 15px; flex-shrink: 0; }
.header-title { font-size: 15px; font-weight: 600; }
.header-sub { font-size: 13px; color: var(--text-muted); }
.header-search { margin-left: auto; display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 6px 12px; }
.header-search i { color: var(--text-muted); font-size: 15px; }
.header-search input { border: none; background: transparent; outline: none; font-size: 14px; color: var(--text); width: 180px; }
.header-search input::placeholder { color: var(--text-hint); }

/* MAIN */
main { max-width: 820px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

/* QUARTER LABEL */
.quarter-row { display: flex; align-items: center; gap: 8px; margin: 2rem 0 0.75rem; }
.quarter-label { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-hint); }
.quarter-count { font-size: 11px; background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 20px; padding: 1px 8px; color: var(--text-muted); }

/* CARD */
.card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; transition: border-color 0.15s; }
.card:hover { border-color: var(--border-strong); }

.card-header { display: flex; align-items: flex-start; gap: 12px; padding: 1rem 1.25rem; cursor: pointer; user-select: none; }
.card-header-left { flex: 1; min-width: 0; }

.card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 3px; }
.card-title { font-size: 15px; font-weight: 500; }

.badge { display: inline-flex; align-items: center; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
.badge-new { background: #FFE8B0; color: #7A4F00; }

.card-short { font-size: 14px; color: var(--text-muted); margin-bottom: 4px; }
.card-date { font-size: 12px; color: var(--text-hint); display: flex; align-items: center; gap: 4px; }

.chevron { color: var(--text-hint); font-size: 18px; transition: transform 0.2s; flex-shrink: 0; margin-top: 2px; }
.chevron.open { transform: rotate(180deg); }

/* CARD BODY */
.card-body { display: none; border-top: 0.5px solid var(--border); padding: 1.1rem 1.25rem; }
.card-body.open { display: block; }

.card-full { font-size: 14px; color: var(--text); line-height: 1.65; margin-bottom: 1rem; }
.card-full p { margin-bottom: 0.6rem; }
.card-full ul { padding-left: 1.2rem; display: flex; flex-direction: column; gap: 3px; }
.card-full h4 { font-size: 13px; font-weight: 600; color: var(--text); margin: 0.8rem 0 0.3rem; }

/* SCREENSHOTS */
.screenshots { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; margin-bottom: 1rem; }
.screenshot { border-radius: var(--radius-sm); border: 0.5px solid var(--border); overflow: hidden; background: var(--surface-2); cursor: pointer; }
.screenshot img { width: 100%; height: auto; display: block; object-fit: unset; }


/* LINKS */
.links-row { display: flex; flex-wrap: wrap; gap: 8px; }
.link-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--link); background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 20px; padding: 4px 12px; text-decoration: none; transition: border-color 0.15s; }
.link-chip:hover { border-color: var(--border-strong); }
.link-chip i { font-size: 14px; }
.link-chip .ext { font-size: 11px; opacity: 0.5; }

/* EMPTY */
.empty { text-align: center; padding: 4rem 2rem; color: var(--text-hint); }
.empty i { font-size: 36px; display: block; margin-bottom: 10px; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.78); z-index: 100; align-items: center; justify-content: center; padding: 2rem; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 100%; max-height: 88vh; border-radius: var(--radius); display: block; }
.lightbox-close { position: fixed; top: 1rem; right: 1rem; background: rgba(255,255,255,0.15); border: none; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 18px; }
</style>
</head>
<body>

<header>
  <div class="header-icon"><i class="ti ti-receipt"></i></div>
  <div>
    <div class="header-title">Release Tracker</div>
    <div class="header-sub">что выкатили в прод</div>
  </div>
</header>

<main id="root"></main>

<div id="empty" class="empty" style="display:none;">
  <i class="ti ti-mood-empty"></i>
  Ничего не найдено
</div>

<div class="lightbox" id="lightbox" onclick="closeLb()">
  <button class="lightbox-close" onclick="closeLb()"><i class="ti ti-x"></i></button>
  <img id="lb-img" src="" alt="">
</div>

  {
    id: 1,
    date: "2026-05-19",
    quarter: "Q2 2026",
    title: "Признак «Индивидуальный тариф»",
    short: "Добавлена возможность помечать тариф как индивидуальный — для клиентов со специальными условиями согласно тарифной политике.",
    full: [
      { type: "p", text: "Согласно тарифной политике, для отдельных клиентов могут быть согласованы специальные условия — под них создаётся <strong>Индивидуальный тариф</strong>." },
      { type: "h4", text: "Как это работает" },
      { type: "ul", items: [
        "При создании нового тарифа — поставить чек-бокс «Индивидуальный тариф».",

      ]},
      { type: "h4", text: "Кто видит признак" },
      { type: "ul", items: [
        "Ревьюер при проверке тарифа.",
        "Команда после создания — тариф визуально отмечен меткой «Индивидуальный план».",

      ]},
      { type: "h4", text: "Зачем это нужно" },
      { type: "ul", items: [
        "Разделить тарифы «для всех» и тарифы с индивидуальными условиями.",
        "Обеспечить соответствие тарифной политике и сделать структуру тарифов прозрачной для внутренних команд."
      ]}
    ],
    images: [
      { src: "IMG1", alt: "Чек-бокс «Индивидуальный тариф» при создании" },
      { src: "IMG2", alt: "Метка «Индивидуальный план» в карточке тарифа" }
    ],

function fmtDate(s) {
  return new Date(s).toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
}

function imgSrc(key) {
  if (key === "IMG1") return IMG1;
  if (key === "IMG2") return IMG2;
  return key;
}

function renderFull(blocks) {
  return blocks.map(b => {
    if (b.type === "p") return `<p>${b.text}</p>`;
    if (b.type === "h4") return `<h4>${b.text}</h4>`;
    if (b.type === "ul") return `<ul>${b.items.map(i => `<li>${i}</li>`).join("")}</ul>`;
    return "";
  }).join("");
}

function groupByQuarter(list) {
  const map = {};
  for (const r of list) {
    if (!map[r.quarter]) map[r.quarter] = [];
    map[r.quarter].push(r);
  }
  return map;
}

function sortQuarters(qs) {
  return qs.sort((a, b) => {
    const [qa, ya] = a.replace("Q","").split(" ").map(Number);
    const [qb, yb] = b.replace("Q","").split(" ").map(Number);
    return ya !== yb ? yb - ya : qb - qa;
  });
}

function render() {
  const filtered = RELEASES;

  const root = document.getElementById("root");
  const empty = document.getElementById("empty");

  if (!filtered.length) { root.innerHTML = ""; empty.style.display = ""; return; }
  empty.style.display = "none";

  const groups = groupByQuarter(filtered);
  const quarters = sortQuarters(Object.keys(groups));
  let html = "";

  quarters.forEach((quarter, qi) => {
    const items = groups[quarter];
    html += `<div class="quarter-row">
      <span class="quarter-label">${quarter}</span>
      <span class="quarter-count">${items.length}</span>
    </div>`;

    items.forEach((r, ri) => {
      const isNewest = qi === 0 && ri === 0;
      html += `
      <div class="card">
        <div class="card-header" onclick="toggle(${r.id})" role="button" tabindex="0">
          <div class="card-header-left">
            <div class="card-top">
              <span class="card-title">${r.title}</span>
              ${isNewest ? '<span class="badge badge-new">Новое</span>' : ""}
            </div>
            <div class="card-short">${r.short}</div>
            <div class="card-date"><i class="ti ti-calendar"></i>${fmtDate(r.date)}</div>
          </div>
          <i class="ti ti-chevron-down chevron ${isNewest ? "open" : ""}" id="chev-${r.id}"></i>
        </div>
        <div class="card-body ${isNewest ? "open" : ""}" id="body-${r.id}">
          <div class="card-full">${renderFull(r.full)}</div>
          ${r.links.length ? `<div class="links-row" style="margin-bottom:1rem">${r.links.map(l =>
            `<a class="link-chip" href="${l.url}" target="_blank" rel="noopener"><i class="ti ${l.icon}"></i>${l.label}<i class="ti ti-external-link ext"></i></a>`
          ).join("")}</div>` : ""}
          ${r.images.length ? `<div class="screenshots">${r.images.map(img =>
            `<div class="screenshot" onclick="openLb('${img.src}')"><img src="${imgSrc(img.src)}" alt="${img.alt}" loading="lazy"></div>`
          ).join("")}</div>` : ""}
        </div>
      </div>`;
    });
  });

  root.innerHTML = html;
}

function toggle(id) {
  const body = document.getElementById("body-" + id);
  const chev = document.getElementById("chev-" + id);
  body.classList.toggle("open");
  chev.classList.toggle("open");
}

function openLb(key) {
  document.getElementById("lb-img").src = imgSrc(key);
  document.getElementById("lightbox").classList.add("open");
}

function closeLb() { document.getElementById("lightbox").classList.remove("open"); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLb(); });

render();
</script>
